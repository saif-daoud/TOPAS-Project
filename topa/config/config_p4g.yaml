domain: P4G
mode: dialogue
api_key_env: TOPA_API_KEY
seed: 42
domain_params:
  system: persuader
  user: persuadee
  adj: persuasion
  interaction_unit: session
paths:
  textbooks: topa/data/textbooks/Persuasion
  data: topa/data/datasets/P4G/p4g_topa.json
  output: outputs/

extraction_params:
  method: "topa_ours" # choices: "ChatGPT", "DeepSeek", "LC_Full", "Chap_Seq", "Chunk_RAG", "Rules", "Merge_RAG", "Mamba", "topa_per_book", "topa_ours"
  role: ["system", "user"]
  role_components:
    system: ["macro_actions", "micro_actions", "conversation_states", "knowledge_graph", "cautions", "rules"]
    user: ["user_profile"] # "user_actions"
  fusion_type: "Late" # choices: "Late", "Early"

annotations_params:
  components:
    # - macro_actions
    # - micro_actions
    # - micro_actions_direct
    - conv_state
    # - intrinsic_reward
    # - cautions
    # - extrinsic_reward

    # - user_profile
    # - user_actions
    # - knowledge_graph
  num_processes: 1
  max_retries: 3

  # Frequent pattern mining after macro_actions annotation
  frequent_pattern_mining:
    enabled: true
    min_support_ratio: 0.1
    min_pattern_length: 2
    max_pattern_length: 10
    top_k: 30
    collapse_consecutive: true

  # Improve micro action space using low-confidence / 'None' micro-action annotations
  action_space_refinement:
    enabled: true
    conf_threshold: 0.65
    context_length: 5
    max_examples_per_macro: 30
    max_new_actions_per_macro: 6

  # Expert evaluator feedback loop: build diverse low-confidence set (clustering)
  expert_feedback:
    enabled: false
    conf_threshold: 0.65
    n_review: 200
    # when propagating expert labels later
    similarity_delta: 0.85

  # Only annotate user profile on a held-out validation subset (for later simulation).
  # If your dataset already has session_metadata.split in {val, validation}, set split_key/split_values accordingly.
  validation_subset:
    enabled: true
    mode: by_session
    ratio: 0.1
    seed: 42
    split_key: split
    split_values:
    - val
    export_path: ''
    user_profile_only: true
    explicit_session_ids_path: topa/data/datasets/P4G/validation_sessions.json
  conv_state_ambiguity:
    enabled: false
    n_review: 200
    context_length: 10
    none_value: none
  macro_actions_params:
    use_annotation_rules: true
    num_processes: 1
  micro_actions_params:
    context_length: 5
    batch_size: 32
    use_annotation_rules: true
  micro_actions_direct_params:
    context_length: 5
    batch_size: 32
    use_annotation_rules: true
  conv_state_params:
    numeric: false
  intrinsic_reward_params:
    context_length: 5
  cautions_params:
    context_length: 5
    batch_size: 32
  extrinsic_reward_params:
    reward_module: topa.reward.p4g
    output_fields:
    - label
    - reward
    - raw
  validation:
    split_values:
    - val
    split_key: split
rl:
  prepare_only: true
  artifact_dir: rl
  runs_dir: runs
  cache_dir: .cache
  sft:
    enabled: false
    state_repr: encoder
    encoder_name: roberta-large
    epochs: 10
    batch_size: 32
    lr: 2e-4
    amp: auto
    run_macro_no_conv: true
    run_conv_state: true
    run_macro_with_conv: true
    run_micro_flat: true
    run_micro_independent: true
    run_termination: true
  ppo:
    enabled: false
    state_repr: encoder
    encoder_name: roberta-large
    epochs: 10
    batch_size: 16
    lr_actor: 3e-5
    lr_critic: 1e-4
    gamma: 0.99
    amp: auto
    plot_action_dist: true
    action_dist_top_k: 30
    action_dist_max_batches: 50
    run_macro_no_conv: true
    run_macro_with_conv: true
    run_micro_flat: true
    run_micro_independent: true
    run_termination: true
simulation:
  output_dir: ''
  validation_subset_path: ''
  methods:
  - prompting
  user_simulator: topa
  num_workers: 1
  seed_turns: 0
  turns: 50
  max_new_tokens: 64
  judge_max_new_tokens: 256
  profile_builder_max_new_tokens: 256
  resume: true
  prefer_ppo: false
  context_turns: -1
  max_macro_turns: 5
  # metadata_keys:
  # - summary
  # - presenting conditions
  extrinsic_reward:
    reward_fn: 'topa.reward.p4g:reward_fn'
    prompt_builder: ''
    judge_system_prompt: You are a strict but fair evaluator. Evaluate only the system
      responses (ignore user messages). Return JSON only.
    output_type: score
    reward_key: reward
    min_value: -1
    max_value: 1
    success_threshold: 1.0
    success_fn: ''

