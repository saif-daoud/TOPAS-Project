domain: "CBT"
mode: "dialogue" # choices: "dialogue", "task"
# Read API key from environment (.env). See repository root .env.example
api_key_env: "TOPA_API_KEY"
seed: 42

domain_params:
  system: "therapist"
  user: "patient"
  adj: "cognitive behavioral therapy"
  interaction_unit: "session"

paths:
  textbooks: "topa/data/textbooks/CBT/"
  data: "topa/data/datasets/CBT/AlexanderStreet_Dataset.json"
  output: "outputs/"

extraction_params:
  method: "topa_ours" # choices: "ChatGPT", "DeepSeek", "LC_Full", "Chap_Seq", "Chunk_RAG", "Rules", "Merge_RAG", "Mamba", "topa_per_book", "topa_ours"
  role: ["system", "user"]
  role_components:
    system: ["macro_actions", "micro_actions", "conversation_states", "knowledge_graph", "cautions", "rules"]
    user: ["user_profile"] # "user_actions"
  fusion_type: "Late" # choices: "Late", "Early"

annotations_params:
  components:
    - macro_actions
    - micro_actions
    - conv_state
    - intrinsic_reward
    - cautions
    - extrinsic_reward
    - user_profile
    # - user_actions
  num_processes: 1
  max_retries: 3

  # Frequent pattern mining after macro_actions annotation
  frequent_pattern_mining:
    enabled: true
    min_support_ratio: 0.1
    min_pattern_length: 2
    max_pattern_length: 10
    top_k: 30
    collapse_consecutive: true

  # Improve micro action space using low-confidence / 'None' micro-action annotations
  action_space_refinement:
    enabled: true
    conf_threshold: 0.65
    context_length: 5
    max_examples_per_macro: 30
    max_new_actions_per_macro: 6

  # Expert evaluator feedback loop: build diverse low-confidence set (clustering)
  expert_feedback:
    enabled: true
    conf_threshold: 0.65
    n_review: 200
    # when propagating expert labels later
    similarity_delta: 0.85

  # Only annotate user profile on a held-out validation subset (for later simulation).
  # If your dataset already has session_metadata.split in {val, validation}, set split_key/split_values accordingly.
  validation_subset:
    enabled: true
    mode: by_user   # by_session | by_user
    ratio: 0.1
    seed: 42
    split_key: split
    split_values: ["val", "validation"]
    export_path: ""  # optional: write chosen indices JSON here (default: <output>/validation_sessions.json)
    user_profile_only: true

  # Conversation-state ambiguity mining: run conv_state twice and export expert review CSV.
  conv_state_ambiguity:
    enabled: false
    n_review: 200
    context_length: 10
    none_value: none

  macro_actions_params:
    use_annotation_rules: true
    num_processes: 1
  micro_actions_params:
    context_length: 5
    batch_size: 32
    use_annotation_rules: true
  conv_state_params:
    numeric: false
  intrinsic_reward_params:
    context_length: 5
  cautions_params:
    context_length: 5
    batch_size: 32
  # user_actions_params:
  #   context_length: 5
  #   batch_size: 32

rl:
  prepare_only: false
  artifact_dir: "rl"
  runs_dir: "runs"
  cache_dir: ".cache"
  activation_model_id: "Qwen/Qwen2.5-7B-Instruct"
  activation_dtype: "float16"
  activation_device_map: "auto"
  activation_transcripts_dir: "extract_internal_representation/transcripts"
  # activation_transcripts_dir: "extract_internal_representation/transcripts"
  activation_out_dir: "extract_internal_representation/activations_{model}" # checked first; regenerated here if missing/incomplete
  # activation_out_dir: "/home/local/QCRI/saif.sedaoud/clean-env/new_env/TOPA/outputs/cognitive behavioral therapy/extract_internal_representation/activations_qwen7b_inst"
  activation_select_layers: ""
  sft:
    enabled: false
    state_repr: "activations"
    conv_state_encoding: "label"
    activation_layer: "22"
    activation_key: "activations"
    mlp_hidden_dim: 0
    mlp_projection_dim: 256
    mlp_conv_state_embedding_dim: 64
    mlp_dropout: 0.1
    epochs: 10
    batch_size: 512
    num_workers: 32
    lr: 3e-4
    amp: "auto"
    run_macro_no_conv: false
    run_conv_state: false
    run_macro_with_conv: true
    run_micro_flat: false
    run_micro_independent: false
    run_termination: true

    use_conv_state: true
    conv_state_source: "probe"
    probe_checkpoint: "/home/local/QCRI/saif.sedaoud/clean-env/new_env/cv_state_preds/probe_results_conversation_states/checkpoints/probe_layer_22.pt"
    include_probe_hidden: false

  offline_rl:
    enabled: true
    algorithm: "iql"
    state_repr: "activations"
    activation_layer: "22"
    activation_key: "activations"
    mlp_hidden_dim: 0
    mlp_projection_dim: 256
    mlp_conv_state_embedding_dim: 64
    mlp_dropout: 0.1
    epochs: 10
    batch_size: 512
    num_workers: 32
    conv_state_encoding: "label"
    init_from_sft: false
    init_critic_fusion_from_sft: false
    iql:
      lr_actor: 3e-5
      lr_critic: 1e-4
      lr_beta: 1e-4
      gamma: 0.99
      expectile: 0.7
      temperature: 1.0
    cql:
      lr_actor: 3e-5
      lr_critic: 1e-4
      lr_beta: 1e-4
      gamma: 0.99
      entropy_alpha: 0.2
      cql_alpha: 1.0
      bc_weight: 1.0
    plot_action_dist: true
    action_dist_top_k: 30
    action_dist_max_batches: 50

    run_policy_over_options_no_conv: true
    run_policy_over_options_with_conv: false
    run_flat_rl: false
    run_intra_option_policies: false
    use_conv_state_for_intra_options: false

    conv_state_source: probe
    probe_checkpoint: "/home/local/QCRI/saif.sedaoud/clean-env/new_env/cv_state_preds/probe_results_conversation_states/checkpoints/probe_layer_22.pt"
    probe_batch_size: 512

simulation:
  output_dir: ""
  validation_subset_path: ""
  methods: ["prompting"]
  user_simulator: "patient_psi"
  num_workers: 1
  seed_turns: 0
  turns: 50
  max_new_tokens: 64
  resume: true
  prefer_ppo: false
  context_turns: -1
  max_macro_turns: 5
  metadata_keys: ["summary", "presenting conditions"]
  extrinsic_reward:
    reward_fn: ""
    prompt_builder: ""
    judge_system_prompt: "You are a strict but fair evaluator. Evaluate only the system responses (ignore user messages). Return JSON only."
    output_type: "score"   # binary | int | float | score
    reward_key: "overall_mean"
    min_value: 0
    max_value: 6
    success_threshold: 4.0
    success_fn: ""
