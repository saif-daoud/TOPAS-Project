domain: P4G
mode: dialogue
api_key_env: TOPA_API_KEY
seed: 42
domain_params:
  system: persuader
  user: persuadee
  adj: persuasion
  interaction_unit: session
paths:
  textbooks: topa/data/textbooks/Persuasion
  data: topa/data/datasets/P4G/p4g_topa.json
  output: outputs/
extraction_params:
  method: topa_ours
  role:
  - system
  - user
  role_components:
    system:
    - macro_actions
    - micro_actions
    - conversation_states
    - knowledge_graph
    - cautions
    - rules
    user:
    - user_profile
  fusion_type: Late
annotations_params:
  components:
  # - macro_actions
  - micro_actions
  # - conv_state
  # - intrinsic_reward
  # - cautions
  # - extrinsic_reward
  # - user_profile
  num_processes: 1
  max_retries: 3
  frequent_pattern_mining:
    enabled: true
    min_support_ratio: 0.1
    min_pattern_length: 2
    max_pattern_length: 10
    top_k: 30
    collapse_consecutive: true
  action_space_refinement:
    enabled: true
    conf_threshold: 0.65
    context_length: 5
    max_examples_per_macro: 30
    max_new_actions_per_macro: 6
  expert_feedback:
    enabled: false
    conf_threshold: 0.65
    n_review: 200
    similarity_delta: 0.85
  validation_subset:
    enabled: true
    mode: by_session
    ratio: 0.1
    seed: 42
    split_key: split
    split_values:
    - val
    export_path: ''
    user_profile_only: true
    explicit_session_ids_path: topa/data/datasets/P4G/validation_sessions.json
  conv_state_ambiguity:
    enabled: false
    n_review: 200
    context_length: 10
    none_value: none
  macro_actions_params:
    use_annotation_rules: true
    num_processes: 1
  micro_actions_params:
    context_length: 5
    batch_size: 32
    use_annotation_rules: true
  conv_state_params:
    numeric: false
  intrinsic_reward_params:
    context_length: 5
  cautions_params:
    context_length: 5
    batch_size: 32
  extrinsic_reward_params:
    reward_module: topa.reward.p4g
    output_fields:
    - label
    - reward
    - raw
  validation:
    split_values:
    - val
    split_key: split
rl:
  prepare_only: false
  artifact_dir: "rl"
  runs_dir: "runs"
  cache_dir: ".cache"
  activation_model_id: "Qwen/Qwen2.5-7B-Instruct"
  activation_dtype: "float16"
  activation_device_map: "auto"
  activation_transcripts_dir: "extract_internal_representation/transcripts"
  activation_out_dir: "extract_internal_representation/activations_{model}" # checked first; regenerated here if missing/incomplete
  activation_select_layers: ""
  sft:
    enabled: false
    state_repr: "activations"
    activation_layer: "all"
    activation_key: "activations"
    mlp_hidden_dim: 256
    mlp_dropout: 0.1
    epochs: 10
    batch_size: 128
    lr: 3e-4
    run_macro_no_conv: true
    run_conv_state: false
    run_macro_with_conv: false
    run_micro_flat: true
    run_micro_independent: true
    run_termination: true
  ppo:
    enabled: true
    state_repr: "activations"
    activation_layer: "all"
    activation_key: "activations"
    mlp_hidden_dim: 256
    mlp_dropout: 0.1
    epochs: 5
    batch_size: 32
    lr_actor: 3e-5
    lr_critic: 1e-4
    gamma: 0.99
    amp: "auto"
    plot_action_dist: true
    action_dist_top_k: 30
    action_dist_max_batches: 50
    run_macro_no_conv: true
    run_macro_with_conv: true
    run_micro_flat: true
    run_micro_independent: true
    run_termination: true

simulation:
  output_dir: ""
  validation_subset_path: ""
  methods: ["prompting"]
  user_simulator: "patient_psi"
  num_workers: 1
  seed_turns: 0
  turns: 50
  max_new_tokens: 64
  resume: true
  prefer_ppo: false
  context_turns: -1
  max_macro_turns: 5
  metadata_keys: ["summary", "presenting conditions"]
  extrinsic_reward:
    reward_fn: ""
    prompt_builder: ""
    judge_system_prompt: "You are a strict but fair evaluator. Evaluate only the system responses (ignore user messages). Return JSON only."
    output_type: "score"   # binary | int | float | score
    reward_key: "overall_mean"
    min_value: 0
    max_value: 6
    success_threshold: 4.0
    success_fn: ""
